<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none" role="img" aria-label="iGOT Karmayogi - National Programme for Civil Services Capacity Building">
  <!--
    iGOT KARMAYOGI OFFICIAL LOGO ASSET
    Location: /public/assets/images/igot-karmayogi-logo.svg
    Purpose: Official Government of India Civil Services Digital Learning Partner Branding
    Reference: National Programme for Civil Services Capacity Building (Mission Karmayogi), DoPT, GoI.
    To replace with an alternate official asset, overwrite this file or place a PNG/SVG at this path.
  -->
  <defs>
    <linearGradient id="flag-grad-saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="flag-grad-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6606" />
    </linearGradient>
  </defs>

  <!-- Karmayogi Emblem / Wheel Motif -->
  <g transform="translate(6, 6)">
    <!-- Outer concentric ring -->
    <circle cx="24" cy="24" r="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Tricolor Swirl / Arc Petals -->
    <!-- Saffron Upper Arc -->
    <path d="M 24 6 A 18 18 0 0 1 41 21 L 34 22 A 11 11 0 0 0 24 13 Z" fill="url(#flag-grad-saffron)" />
    <!-- Navy Blue Core / Ashoka Motif -->
    <circle cx="24" cy="24" r="8.5" fill="#0B2545" />
    <circle cx="24" cy="24" r="3.5" fill="#FFFFFF" />
    <!-- 8 Radiant Spokes -->
    <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round">
      <line x1="24" y1="16.5" x2="24" y2="18" />
      <line x1="24" y1="30" x2="24" y2="31.5" />
      <line x1="16.5" y1="24" x2="18" y2="24" />
      <line x1="30" y1="24" x2="31.5" y2="24" />
      <line x1="18.7" y1="18.7" x2="19.8" y2="19.8" />
      <line x1="28.2" y1="28.2" x2="29.3" y2="29.3" />
      <line x1="18.7" y1="29.3" x2="19.8" y2="28.2" />
      <line x1="28.2" y1="19.8" x2="29.3" y2="18.7" />
    </g>
    <!-- Green Lower Arc -->
    <path d="M 24 42 A 18 18 0 0 1 7 27 L 14 26 A 11 11 0 0 0 24 35 Z" fill="url(#flag-grad-green)" />
  </g>

  <!-- Brand Typography -->
  <!-- "iGOT" text -->
  <g transform="translate(62, 10)">
    <!-- Lowercase 'i' in vibrant saffron/orange -->
    <circle cx="3.5" cy="5" r="2.8" fill="#FF9933" />
    <path d="M 1.5 11 L 5.5 11 L 5.5 24 L 1.5 24 Z" fill="#FF9933" />
    
    <!-- "GOT" in solid primary navy #0B2545 -->
    <text x="10" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#0B2545" letter-spacing="-0.5px">GOT</text>
  </g>

  <!-- "कर्मयोगी" in Hindi Devanagari & "KARMAYOGI" in English -->
  <g transform="translate(62, 42)">
    <text x="0" y="0" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11" font-weight="800" fill="#1E3A8A" letter-spacing="0.5px">कर्मयोगी</text>
    <text x="44" y="-1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1.2px">KARMAYOGI</text>
  </g>

  <!-- Subtle Bharat / National Platform Tag -->
  <g transform="translate(62, 53)">
    <!-- Micro tricolor accent line -->
    <rect x="0" y="0" width="16" height="2" fill="#FF9933" rx="1" />
    <rect x="18" y="0" width="16" height="2" fill="#CBD5E1" rx="1" />
    <rect x="36" y="0" width="16" height="2" fill="#138808" rx="1" />
    <text x="58" y="2.5" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8px">GOVERNMENT OF INDIA</text>
  </g>
</svg>